# cargo-deny configuration. Run: cargo deny check
#
# The dependency set is deliberately tiny (clap, serde, serde_json, iced-x86 and
# what they pull in). Every rule below is set to fail rather than warn, so a
# dependency that drifts outside the policy breaks CI instead of sliding in.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2

# Permissive licences only. The generator itself is GPL-3.0-or-later; anything
# copyleft arriving as a *dependency* would be a surprise worth reviewing, and
# that is what this list is for.
#
# The list is exactly what the current graph uses, not a comfortable margin. A
# new dependency under some other permissive licence will fail this check, which
# is the intent: adding one should be a decision someone makes, not something
# that slides in because BSD-3-Clause happened to be pre-approved years ago.
#
#   MIT           most of the graph
#   Apache-2.0    the other half of the usual "MIT OR Apache-2.0" dual licence
#   Unicode-3.0   unicode-ident, which is "(MIT OR Apache-2.0) AND Unicode-3.0"
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.93
exceptions = []

# Skip the licence check for our own crate. cargo-deny applies `allow` to every
# package in the graph including workspace members, so the permissive-only list
# above rejected acl-offsetgen itself for being GPL-3.0-or-later. Adding GPL to
# the allow list would have "fixed" it by also letting a copyleft dependency
# through unnoticed, which is the one thing the list exists to prevent. This
# only covers members marked `publish = false`, which acl-offsetgen is.
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = false
highlight = "all"

# Nothing in this project should ever need to reach the network, spawn a shell,
# open a socket or link native code. If one of these shows up as a transitive
# dependency, that is a change in what the build can do, and it should be a
# conscious decision rather than a silent upgrade.
deny = [
  { name = "reqwest" },
  { name = "hyper" },
  { name = "ureq" },
  { name = "curl" },
  { name = "curl-sys" },
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  { name = "rustls" },
  { name = "tokio" },
  { name = "async-std" },
  { name = "zip" },
  { name = "flate2" },
  { name = "git2" },
  { name = "libgit2-sys" },
]

skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies. A git dep is a moving target that Cargo.lock pins by
# commit but that nobody re-reviews when it moves.
allow-git = []
