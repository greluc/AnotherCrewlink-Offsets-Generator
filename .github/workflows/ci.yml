name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Advisories are the one check whose result changes without anyone touching
  # the code: a graph that is clean today can be vulnerable tomorrow. This
  # repository sees a burst of commits around a game update and then nothing for
  # months, so without a schedule the first notice would arrive far too late.
  schedule:
    - cron: "17 6 * * 1"

# Least privilege by default. No job here needs to write anything, and a
# workflow that cannot push cannot be turned into one that does by a compromised
# dependency.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail rather than reach for a network mirror mid-build.
  CARGO_NET_RETRY: 2
  # RUSTFLAGS is deliberately not set here. `-D warnings` in the environment
  # applies to dependencies as well, so a warning in someone else's crate would
  # fail our build. `cargo clippy -- -D warnings` below denies rustc warnings
  # too, and only for the code we actually own.

jobs:
  test:
    name: build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are avoided entirely, and the one first-party action
      # is pinned to a commit rather than a tag: a tag can be moved, a commit
      # cannot. actions/checkout v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # The runner ships rustup, which installs exactly what rust-toolchain.toml
      # asks for. No toolchain action needed.
      - name: Show toolchain
        run: |
          rustup show
          cargo --version

      # --locked everywhere: the build uses the committed Cargo.lock or fails.
      # Without it, a yanked-and-republished version could slip in silently.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build release
        run: cargo build --locked --release

      - name: Verify Cargo.lock is unchanged
        shell: bash
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock changed during the build; commit the updated lock file." >&2
            git diff -- Cargo.lock >&2
            exit 1
          fi

  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Cargo.toml declares a rust-version. Nothing used to check it, and it was
      # wrong: it claimed 1.82 while clap and indexmap had moved to edition
      # 2024, which needs 1.85. An untested MSRV is a claim with no consumer, so
      # either it gets verified or it should not be there.
      - name: Check against the declared rust-version
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          echo "declared MSRV: $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          # rust-toolchain.toml would otherwise override the choice.
          cargo "+$msrv" check --locked --all-targets

  supply-chain:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # cargo-deny is installed rather than run through its own action, so the
      # workflow depends on one fewer third-party repository. --locked pins its
      # dependency tree too.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      # advisories: known vulnerabilities and unmaintained crates
      # bans:       the deny list in deny.toml, plus duplicate versions
      # licenses:   permissive only, and exactly the set in use
      # sources:    crates.io only, no git dependencies
      - name: cargo deny
        run: cargo deny --all-features check advisories bans licenses sources

      - name: No unexpected dependencies
        shell: bash
        run: |
          # The dependency set is meant to stay small enough to read. If it
          # grows, that should be a decision, not something noticed later.
          #
          # --target matters: this job runs on Linux but the tool only ever ships
          # for Windows, so without it the count describes a graph nobody builds.
          #
          # Counting crate *names* rather than tree lines, and printing them.
          # cargo tree's output is host-dependent -- on a Windows host the
          # proc-macro subtree collapses into "(*)" back-references, on a Linux
          # host targeting Windows it is spelled out -- so a bare number differs
          # between the machine you check on and the runner, for no reason worth
          # anyone's time. The list makes any future surprise self-explaining.
          mapfile -t crates < <(
            cargo tree --locked --edges normal --prefix none \
              --target x86_64-pc-windows-msvc \
            | awk 'NF { print $1 }' | sort -u
          )
          echo "${#crates[@]} distinct crates in the Windows dependency graph:"
          printf '  %s\n' "${crates[@]}"
          if [ "${#crates[@]}" -gt 40 ]; then
            echo "Dependency graph grew past the agreed budget of 40 crates." >&2
            exit 1
          fi

  tool-pin:
    name: pinned dumper still matches
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Downloads the pinned Il2CppDumper and verifies its digest. This is the
      # canary for the archive being replaced upstream: GitHub release assets
      # can be deleted and re-uploaded, and we would rather find out here than
      # while trying to ship offsets after a game update. The weekly schedule
      # above is what makes it a canary rather than a coincidence.
      - name: Fetch and verify Il2CppDumper
        shell: pwsh
        run: ./tools/fetch-il2cppdumper.ps1

      - name: Doctor
        run: cargo run --locked --release -- doctor
